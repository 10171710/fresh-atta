<!-- Pre-paint script: applies saved theme + text direction BEFORE first paint (no flash) and writes
     the matching Bootstrap build (LTR or RTL). Keys: mm-theme (light|dark), mm-dir (ltr|rtl).
     Legacy values "ar"/"he" are treated as RTL. -->
<script>
(function () {
  var d = document.documentElement, t = null, r = 'ltr';
  try { t = localStorage.getItem('mm-theme'); r = localStorage.getItem('mm-dir') || 'ltr'; } catch (e) {}
  if (r === 'ar' || r === 'he') r = 'rtl';
  if (r !== 'ltr' && r !== 'rtl') r = 'ltr';
  if (t !== 'dark' && t !== 'light') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  var rtl = r === 'rtl';
  d.setAttribute('data-bs-theme', t); d.setAttribute('lang', 'en'); d.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  document.write('<link rel="stylesheet" id="bs-css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap' + (rtl ? '.rtl' : '') + '.min.css">');
})();
</script>
