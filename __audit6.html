<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Service area audit</title>
<style>body{font:13px/1.45 monospace;white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">RUNNING</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const results = {};
  async function withFrame(width, dir, theme, fn) {
    try { localStorage.setItem('mm-dir', dir); localStorage.setItem('mm-theme', theme); } catch (e) {}
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;left:0;top:0;border:0;width:' + width + 'px;height:900px';
    f.src = 'delivery-plans.html?layout=' + width + '-' + dir + '-' + theme + '-' + Date.now();
    document.body.appendChild(f);
    await new Promise(r => { f.onload = r; });
    await wait(350);
    const d = f.contentDocument, w = f.contentWindow;
    const value = await fn(d, w, f);
    f.remove();
    return value;
  }

  function measure(d, w) {
    const section = d.querySelector('#area-title').closest('section');
    const container = section.querySelector('.container-xxl');
    const cr = container.getBoundingClientRect();
    const cc = (cr.left + cr.right) / 2;
    const head = section.querySelector('.section-head');
    const eyebrow = head.querySelector('.eyebrow');
    const h2 = d.querySelector('#area-title');
    const search = head.querySelector('.area-search');
    const input = d.querySelector('#area-search');
    const cs = (el, p) => w.getComputedStyle(el)[p];
    const delta = el => {
      const r = el.getBoundingClientRect();
      return Math.round((r.left + r.right) / 2 - cc);
    };
    const rect = el => {
      const r = el.getBoundingClientRect();
      return { x: Math.round(r.x), w: Math.round(r.width), right: Math.round(r.right) };
    };
    const icon = d.querySelector('.area-search .bi-search');
    const ir = icon.getBoundingClientRect();
    const inputRect = input.getBoundingClientRect();
    return {
      dir: d.documentElement.dir,
      viewport: w.innerWidth,
      headTextAlign: cs(head, 'textAlign'),
      eyebrowCenterDelta: delta(eyebrow),
      h2CenterDelta: delta(h2),
      searchCenterDelta: delta(search),
      search: rect(search),
      input: rect(input),
      iconInsideStart: d.documentElement.dir === 'rtl'
        ? Math.round(inputRect.right - ir.right) <= 40
        : Math.round(ir.left - inputRect.left) <= 40,
      tableTop: Math.round(section.querySelector('.table-wrap').getBoundingClientRect().top),
      searchBottom: Math.round(search.getBoundingClientRect().bottom),
      overflow: d.body.scrollWidth - w.innerWidth
    };
  }

  for (const [w, dir] of [[1280, 'ltr'], [1280, 'rtl'], [375, 'ltr'], [375, 'rtl']]) {
    results[w + '-' + dir] = await withFrame(w, dir, 'light', measure);
  }

  const src = await (await fetch('docs/contract-check.js?x=' + Date.now())).text();
  (0, eval)(src);
  results.contract = await window.mmCheck(['delivery-plans.html']);

  out.textContent = 'RESULTS:' + JSON.stringify(results, null, 2);
})().catch(err => {
  document.getElementById('out').textContent = 'ERROR:' + (err && err.stack || err);
});
</script>
</body>
</html>
